[package]
name = "radar-core-decode"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "568d5866133ad4ce1fbc164823c995df7bec8c34", default-features = false, features = ["core-block-hash-use-x11"] }
wasm-bindgen = "=0.2.118"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
hex = "0.4"

[dev-dependencies]
dashcore = { git = "https://github.com/dashpay/rust-dashcore", rev = "568d5866133ad4ce1fbc164823c995df7bec8c34", default-features = false, features = ["core-block-hash-use-x11"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
