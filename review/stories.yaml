# Radar user stories: source of truth for the review harness.
# Placeholders like {mn_regular} or {doc.type} are entities picked by
# review/fixtures.mjs into review/fixtures/{mainnet,testnet}.json. {key} is the
# entity's primary id; {key.field} reads another field.
# prod URLs are mainnet addresses; the harness maps them to the testnet host or
# parameter of the same product (review/lib/sites.mjs).
stories:
  - id: RA-01
    group: 'Radar (RA): compare with radar.dashhq.org'
    shard: S1
    story: As a network watcher I want the network's size and freshness at a glance
    acceptance: Home shows nodes that answered the last crawl, the day-over-day change, the Core tip height and "crawled N min ago"; the numbers match the same crawl's figures on radar.dashhq.org
    radar_start: /
    prod:
      - https://radar.dashhq.org/
    phone: true
  - id: RA-02
    group: 'Radar (RA): compare with radar.dashhq.org'
    shard: S1
    story: As a network watcher I want each headline figure to open the nodes behind it
    acceptance: Reachable masternodes, enabled, PoSe-banned, countries, hosting providers and addresses tried each open a filtered list or section that shows that many items
    radar_start: /
    prod:
      - https://radar.dashhq.org/
    phone: false
  - id: RA-03
    group: 'Radar (RA): compare with radar.dashhq.org'
    shard: S1
    story: As a network watcher I want to scope the census to masternodes, evonodes, other full nodes or all
    acceptance: A scope control changes the version, location and reach sections; the scope survives reload and a copied link
    radar_start: /
    prod:
      - https://radar.dashhq.org/
    phone: false
